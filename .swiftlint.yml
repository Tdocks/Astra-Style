# ==============================================================================
# .swiftlint.yml — Astra Style
# ==============================================================================
# Tuned against the real codebase in ios/AstraStyle (Core/DesignSystem,
# Core/Networking, Domain/Models/Enums.swift, Features/Home, Features/Slice
# were read before writing this file), not the stock SwiftLint rule set.
# Wired into CI (strict — every warning fails the build) in
# .github/workflows/ios.yml, and runs locally in Xcode via a Run Script
# build phase for immediate feedback while typing.
#
# VERIFICATION CAVEAT: `swiftlint` itself could not be installed/run in the
# environment this file was authored in (SwiftLint has no official Linux
# binary release compatible with this container; building it from source
# requires a Swift toolchain with SwiftSyntax matching SwiftLint's pinned
# version, which was not available here). Every rule/threshold below was
# therefore chosen by manually grepping/measuring the real source (line
# lengths, file lengths, force-unwrap/force-try/IUO occurrences, existing
# custom-rule violations) rather than by running `swiftlint lint` and
# iterating on real output. Treat the first real CI run of this config as
# the actual verification pass, the same way ios.yml's own header comment
# treats its first xcodebuild run.
# ==============================================================================

# ------------------------------------------------------------------------------
# Scope
# ------------------------------------------------------------------------------
included:
  - ios/AstraStyle

excluded:
  # XcodeGen-generated project file — not source, and regenerated by
  # `xcodegen generate` on every CI run anyway (see ios/project.yml header).
  - ios/AstraStyle.xcodeproj
  # SPM/Xcode build output, if this is ever run against a local checkout
  # that has already built.
  - ios/.build
  - ios/DerivedData
  # Vendored/generated web tooling for the (non-Swift) design system pages —
  # not Swift, but excluded defensively in case this config is ever pointed
  # at the repo root instead of ios/AstraStyle.
  - design/node_modules

# ------------------------------------------------------------------------------
# Opt-in rules
# ------------------------------------------------------------------------------
# Deliberately a SHORT list, not "enable everything opt-in" — every rule
# here was checked by hand against the real source (see verification caveat
# above) and produces zero or one known, explicitly-handled violation. A
# long opt-in list chosen without being able to run swiftlint would just be
# a guess dressed up as rigor.
opt_in_rules:
  # The three CLAUDE.md-mandated rules ("No force unwraps, no try!, no
  # as!" — as! has no direct SwiftLint rule name beyond force_cast, which
  # is already a default rule; IUO is the closest match for the spirit of
  # that line). Zero non-test occurrences of any of the three found in the
  # codebase as of this writing (see below) — enabling them does not create
  # busywork, it locks in behavior that already holds.
  - force_unwrapping
  - force_try
  - implicitly_unwrapped_optional
  # Low-risk, high-value stylistic opt-ins that a codebase this disciplined
  # about explicit `guard let`/protocol boundaries is very unlikely to
  # violate by accident, checked by hand against the sampled files above.
  - contains_over_first_not_nil
  - empty_count
  - closure_spacing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - redundant_type_annotation
  - first_where

# ------------------------------------------------------------------------------
# Rules disabled outright
# ------------------------------------------------------------------------------
disabled_rules:
  # `todo` (the default TODO/FIXME-comment rule) is left OFF rather than
  # tuned: there are zero TODO/FIXME comments in the codebase today, so it
  # would be a no-op either way, but this project's own convention (spec
  # §22 acceptance bar, CLAUDE.md testing section) is to track gaps as
  # failing tests (see Tests/UnitTests/PendingIntegrationRequirementsTests.swift,
  # Tests/UITests/AstraStyleUITests.swift's intentionally-failing
  # placeholders) rather than TODO comments, so this rule would fight that
  # convention rather than support it if a TODO ever did slip in.
  - todo

# ------------------------------------------------------------------------------
# Custom rules — mirror scripts/check_ui_conventions.py exactly, so both
# violations surface in Xcode as you type (SwiftLint, this file) and fail
# CI as a second, independent check (the Python script, wired into
# .github/workflows/ios.yml). Regexes and rationale copied from that
# script's own docstring; keep the two in sync if either rule's definition
# changes.
# ------------------------------------------------------------------------------
custom_rules:
  no_ai_sparkle_glyph:
    included: ".*\\.swift"
    excluded: ".*/Tests/.*"
    match_kinds:
      - string
    regex: '(?i)\bsparkles?\b|wand\.and\.(?:stars|rays)'
    message: >-
      Banned "AI sparkle" glyph/word in a user-facing string. Astra Style is
      a stylist, not a magic trick (spec §3: "technology remains
      invisible") — Kyra's mark is AstraMonogram, not a wand or sparkle. See
      scripts/check_ui_conventions.py.
    severity: error

  no_internal_ticket_id_in_string:
    included: ".*\\.swift"
    excluded: ".*/Tests/.*"
    match_kinds:
      - string
    regex: '\bP\d-[A-Z]{2,}\b'
    message: >-
      Internal ticket id (e.g. P3-CLOSET) found in a user-facing string
      literal. Describe what the screen is for instead — see
      scripts/check_ui_conventions.py.
    severity: error

# ------------------------------------------------------------------------------
# Tuned defaults
# ------------------------------------------------------------------------------

# Measured against every non-generated .swift file under ios/AstraStyle:
# real feature/framework code tops out at 215 columns (a long accessibility
# label concatenation in HeroOutfitCardView.swift); data-heavy fixture/test
# files (Core/Mocks/SampleData.swift, Tests/UITests/AstraStyleUITests.swift)
# run up to 287. Rather than special-case those files (SwiftLint has no
# reliable per-file override for a built-in rule short of a second nested
# config, which is more moving parts than this warrants), the ceiling below
# is set with headroom above the observed max so today's codebase produces
# zero violations under `swiftlint lint --strict`, while still bounding
# future lines at a level well past anything currently considered
# acceptable style here. Tighten this once the codebase is larger and an
# actual `swiftlint` run (see verification caveat above) confirms the real
# violation count at a stricter threshold.
line_length:
  warning: 220
  error: 320
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true

# Default warning threshold (400 lines) is below two real files as of this
# writing: Features/Slice/SliceView.swift (408, the vertical slice's single
# screen — see that directory's README for why it isn't split further yet)
# and Tests/UnitTests/SliceViewModelTests.swift (536, Swift Testing's
# `@Test`-per-case style naturally produces long files). Bumped with
# headroom above the observed max (536) for the same "don't create
# retroactive busywork on code that was already reviewed and merged" reason
# as line_length above.
file_length:
  warning: 560
  error: 1000
  ignore_comment_only_lines: true

# Default warning threshold (250 lines) is close enough to
# Core/DesignSystem/Previews/DesignSystemGallery.swift's single `View`
# struct (~237 lines) that routine edits to that file would trip it by
# accident. Small headroom added; still meaningfully tighter than
# file_length above since a single oversized TYPE (as opposed to a file
# with many small types, e.g. Domain/Models/Enums.swift) is a more useful
# "should this be split up" signal.
type_body_length:
  warning: 280
  error: 400

# Default min_length (warning: 3) would flag AstraMonogramGeometry's loop
# counter (`var i = 2`, Core/DesignSystem/Components/AstraMonogram.swift) —
# a conventional, unambiguous loop-index name, not an unclear identifier.
# `id` also appears throughout Domain/Models as a Codable property name
# mirroring every table's `id` column (docs/04-data-model.md) and should
# not be flagged either.
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - i
    - j
    - x
    - y
