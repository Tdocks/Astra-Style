# Prefer deploying from the monorepo root (`npx wrangler deploy` uses ../wrangler.toml).
# This file exists so a Pages project with Root directory = `web` also works.

name = "astra-style"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
