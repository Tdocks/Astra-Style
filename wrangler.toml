# Cloudflare Workers static assets — run from repo root:
#   npx wrangler deploy
#
# The marketing site lives under web/dist (committed HTML + assets).
# See web/GATE.md for domain / brand brief.

name = "astra-style"
compatibility_date = "2026-08-01"
workers_dev = true

# Bind the purchased domain on deploy (Cloudflare creates DNS + certs).
# Requires the astra-style.com zone to already be on this Cloudflare account.
[[routes]]
pattern = "astra-style.com"
custom_domain = true

[[routes]]
pattern = "www.astra-style.com"
custom_domain = true

[assets]
directory = "./web/dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
