# project.yml
#
# XcodeGen project definition for Astra Style.
#
# Usage:
#   brew install xcodegen
#   cd ios
#   cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig   # then fill in real values
#   xcodegen generate
#   open AstraStyle.xcodeproj
#
# See /tmp/astra/ios/README.md for full setup instructions.

name: AstraStyle
options:
  bundleIdPrefix: com.astrastyle
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

# Shared build settings applied to every target unless overridden below.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # NOTE: SWIFT_DEFAULT_ACTOR_ISOLATION is deliberately NOT set to MainActor.
    # This codebase is built the other way around: Domain models are plain
    # Sendable value types, repositories are Sendable and run off the main
    # actor, and only view models are explicitly @MainActor. Defaulting every
    # type to MainActor contradicts that and made ~25 call sites fail with
    # "main actor-isolated initializer cannot be called from outside of the
    # actor". The default (nonisolated) is correct here.
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    # NOTE: SWIFT_TREAT_WARNINGS_AS_ERRORS is deliberately NOT set here.
    # Phase 1 exit criteria (docs/01-build-roadmap.md) require "CI ... fails
    # the build on a compiler warning", but setting this globally would make
    # local development fragile: an unused variable mid-refactor, a
    # first-draft unused parameter, or a deprecation warning from a newer
    # SDK would all hard-block a local `xcodebuild`/Xcode build instead of
    # just being visible while iterating — exactly the "makes iterating
    # painful" failure mode the roadmap warns against. Warnings-as-errors is
    # instead enforced ONLY in CI, via an xcodebuild command-line build
    # setting override (`SWIFT_TREAT_WARNINGS_AS_ERRORS=YES`) added to the
    # `xcodebuild build`/`xcodebuild test` invocations in
    # .github/workflows/ios.yml. That override:
    #   - touches nothing in this file or the generated .xcodeproj, so
    #     `xcodegen generate` output is identical whether run locally or in
    #     CI;
    #   - applies to every target built in that invocation (app + test
    #     targets), matching "fails the build on a compiler warning" at the
    #     point that actually gates a PR;
    #   - is trivial to reproduce locally on demand for a pre-push check:
    #     `xcodebuild build -project AstraStyle.xcodeproj -scheme AstraStyle
    #     -destination 'platform=iOS Simulator,name=iPhone 16'
    #     SWIFT_TREAT_WARNINGS_AS_ERRORS=YES`.
    # As of this change the project builds with zero warnings (see
    # ios.yml's own header comment on the state of the build), so turning
    # this on in CI does not create a backlog of newly-failing PRs.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  AstraStyle:
    type: application
    platform: iOS
    sources:
      - path: AstraStyle
        excludes:
          # Test code belongs to the test targets, not the app.
          - "Tests/**"
          # Documentation must never be classified as a bundle resource.
          # XcodeGen treats any non-source file as a resource, so the twelve
          # per-feature README.md files would each be copied to the SAME
          # destination (AstraStyle.app/README.md) and collide — producing one
          # "duplicate output file" warning per file after the first. Excluding
          # markdown keeps the docs next to the code they describe without
          # shipping them inside the app bundle.
          - "**/*.md"
          # Info.plist and the entitlements file are generated by XcodeGen from
          # the `info:` and `entitlements:` blocks below and wired in through
          # build settings. Letting `sources` pick them up as well would copy
          # them into the bundle a second time.
          - "Resources/Info.plist"
          - "Resources/AstraStyle.entitlements"
    # NOTE: there is deliberately no `resources:` entry here. `sources:` above
    # already includes AstraStyle/Resources recursively, and XcodeGen classifies
    # non-source files into the copy-resources phase automatically. Declaring the
    # same directory again adds every file to that phase twice.
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrastyle.app
        # PRODUCT_NAME is the BUILD artifact name, not what the user sees.
        # It was "Astra Style", and the space caused two separate failures:
        #   1. The Swift module name became `Astra_Style` (non-alphanumerics are
        #      substituted), so code saying `AstraStyle.WeatherCondition` to
        #      disambiguate from WeatherKit's could not resolve.
        #   2. The product became "Astra Style.app", but the test targets derive
        #      TEST_HOST from the TARGET name — they looked for AstraStyle.app
        #      and the whole test action failed to launch.
        # The user-facing name lives in CFBundleDisplayName below, which is the
        # correct place for it and is already set to "Astra Style".
        PRODUCT_NAME: AstraStyle
        PRODUCT_MODULE_NAME: AstraStyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: AstraStyle/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Astra Style"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark

        # Bridges the xcconfig-only values (Config/Secrets.xcconfig) into
        # the app bundle so AstraEnvironment can read them at runtime via
        # Bundle.main.infoDictionary. Per spec §25, these are the ONLY two
        # values the client ever receives.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)

        # --- Usage descriptions ------------------------------------------------
        # Real, user-facing copy per spec §7 "Permissions" (request only in
        # context, explain why). Do not ship the Apple-template placeholder text.
        NSCameraUsageDescription: >-
          Astra Style uses your camera to scan garments so Kyra can catalog
          them in your closet and recommend outfits that use what you
          already own.
        NSPhotoLibraryUsageDescription: >-
          Astra Style can import photos of your clothes and reference photos
          of yourself so Kyra can build your wardrobe and generate styling
          previews. We only access the photos you choose to add.
        NSPhotoLibraryAddUsageDescription: >-
          Astra Style can save outfit visuals and Style Studio generations
          to your photo library when you choose to save them.
        NSLocationWhenInUseUsageDescription: >-
          Astra Style uses your approximate location to check the day's
          weather so Kyra's outfit recommendations suit the conditions
          outside.
        NSCalendarsUsageDescription: >-
          Astra Style can read your upcoming events so Kyra can tailor
          outfit recommendations to what's actually on your schedule, like
          a client meeting or dinner reservation.
        NSCalendarsFullAccessUsageDescription: >-
          Astra Style can read your upcoming events so Kyra can tailor
          outfit recommendations to what's actually on your schedule, like
          a client meeting or dinner reservation.
        NSMicrophoneUsageDescription: >-
          Astra Style uses your microphone so you can talk to Kyra instead
          of typing when asking style questions.
        NSSpeechRecognitionUsageDescription: >-
          Astra Style converts your spoken questions to text so Kyra can
          understand and respond to voice requests.
        NSUserTrackingUsageDescription: >-
          Astra Style does not track you across other companies' apps or
          websites. This permission is not used to serve targeted
          advertising.

        # --- URL scheme for Sign in with Apple / OAuth-style callbacks --------
        CFBundleURLTypes:
          - CFBundleURLName: com.astrastyle.app.auth
            CFBundleURLSchemes:
              - astrastyle
            CFBundleTypeRole: Editor

        # --- Associated domains would also be configured here for the
        # universal-link based Sign in with Apple / magic-link flow; add via
        # the entitlements file below once the real domain is known.

        LSApplicationQueriesSchemes:
          - itms-apps

        UIBackgroundModes:
          - remote-notification

        UIRequiredDeviceCapabilities:
          - arm64

    entitlements:
      path: AstraStyle/Resources/AstraStyle.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.astrastyle.app

  AstraStyleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AstraStyle/Tests/UnitTests
    dependencies:
      - target: AstraStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrastyle.app.unittests
        GENERATE_INFOPLIST_FILE: YES

  AstraStyleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AstraStyle/Tests/UITests
    dependencies:
      - target: AstraStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrastyle.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AstraStyle

schemes:
  AstraStyle:
    build:
      targets:
        AstraStyle: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AstraStyleTests
        - AstraStyleUITests
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
